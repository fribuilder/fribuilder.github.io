<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="dyn-t dyn-d" font-family="inherit">
  <title id="dyn-t">Keeping only the imagined experience that stays near real experience</title>
  <desc id="dyn-d">A path of points shows experience collected from the real environment, each surrounded by a dashed circle of a fixed radius. Branching off that path are steps imagined by the learned model. Imagined steps that land inside one of the circles are close enough to real experience and are kept for training. Imagined steps that land outside every circle are discarded before they reach the learner.</desc>

  <defs>
    <marker id="dyn-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--accent, #2f6fed)"/>
    </marker>
    <marker id="dyn-ar-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--muted, #666)"/>
    </marker>
  </defs>

  <text x="180" y="24" text-anchor="middle" font-size="11" fill="var(--muted, #666)">an imagined step is kept only if it lands near real experience</text>

  <!-- tolerance circles -->
  <g fill="none" stroke="var(--line, #e7e7e7)" stroke-width="1.4" stroke-dasharray="4 4">
    <circle cx="60"  cy="120" r="25"/>
    <circle cx="120" cy="102" r="25"/>
    <circle cx="185" cy="88"  r="25"/>
    <circle cx="250" cy="72"  r="25"/>
  </g>

  <!-- radius annotation -->
  <line x1="185" y1="88" x2="185" y2="63" stroke="var(--muted, #666)" stroke-width="1.2"/>
  <text x="191" y="72" font-size="11" fill="var(--muted, #666)">tolerance</text>

  <!-- real trajectory -->
  <polyline points="60,120 120,102 185,88 250,72" fill="none" stroke="currentColor" stroke-width="2"/>
  <g fill="currentColor">
    <circle cx="60"  cy="120" r="4.5"/>
    <circle cx="120" cy="102" r="4.5"/>
    <circle cx="185" cy="88"  r="4.5"/>
    <circle cx="250" cy="72"  r="4.5"/>
  </g>

  <!-- imagined steps that are kept -->
  <g stroke="var(--accent, #2f6fed)" stroke-width="1.5" fill="none">
    <path d="M120,102 L134,89" marker-end="url(#dyn-ar)"/>
    <path d="M250,72 L258,57" marker-end="url(#dyn-ar)"/>
  </g>
  <g fill="var(--accent, #2f6fed)">
    <circle cx="137" cy="86" r="4"/>
    <circle cx="261" cy="54" r="4"/>
  </g>

  <!-- imagined steps that are discarded -->
  <g stroke="var(--muted, #666)" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M185,88 L222,116" marker-end="url(#dyn-ar-m)"/>
    <path d="M60,120 L38,146" marker-end="url(#dyn-ar-m)"/>
  </g>
  <g stroke="var(--muted, #666)" stroke-width="1.8">
    <path d="M224,116 l8,8 M232,116 l-8,8"/>
    <path d="M29,146 l8,8 M37,146 l-8,8"/>
  </g>

  <!-- legend -->
  <line x1="14" y1="180" x2="30" y2="180" stroke="currentColor" stroke-width="2"/>
  <text x="36" y="184" font-size="10.5" fill="currentColor">real experience</text>

  <circle cx="130" cy="180" r="4" fill="var(--accent, #2f6fed)"/>
  <text x="140" y="184" font-size="10.5" fill="currentColor">imagined, kept</text>

  <g stroke="var(--muted, #666)" stroke-width="1.8">
    <path d="M228,176 l8,8 M236,176 l-8,8"/>
  </g>
  <text x="244" y="184" font-size="10.5" fill="currentColor">imagined, discarded</text>
</svg>
