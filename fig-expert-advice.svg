<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 200" role="img" aria-labelledby="exp-t exp-d" font-family="inherit">
  <title id="exp-t">How many experts to pay for depends on what an opinion costs</title>
  <desc id="exp-d">A horizontal scale showing the cost of observing one expert, running from expensive on the left to cheap on the right. It is divided into three regimes. When opinions are expensive, the best strategy consults a single expert per round, as in a bandit problem. In an intermediate range it consults an in-between number. When opinions are cheap, it consults every expert, recovering full-information learning. The paper proves matching upper and lower bounds in all three regimes.</desc>

  <defs>
    <marker id="exp-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="var(--muted, #666)"/>
    </marker>
  </defs>

  <!-- zone dividers -->
  <line x1="126" y1="34" x2="126" y2="126" stroke="var(--line, #e7e7e7)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="234" y1="34" x2="234" y2="126" stroke="var(--line, #e7e7e7)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- regime labels -->
  <text x="73" y="50" text-anchor="middle" font-size="13" fill="currentColor">consult 1</text>
  <text x="180" y="50" text-anchor="middle" font-size="13" fill="currentColor">consult some</text>
  <text x="293" y="50" text-anchor="middle" font-size="13" fill="currentColor">consult all</text>

  <!-- dots showing how many experts are observed -->
  <g fill="var(--accent, #2f6fed)">
    <circle cx="73" cy="76" r="4.5"/>

    <circle cx="160" cy="76" r="4.5"/>
    <circle cx="180" cy="76" r="4.5"/>
    <circle cx="200" cy="76" r="4.5"/>

    <circle cx="253" cy="76" r="4.5"/>
    <circle cx="273" cy="76" r="4.5"/>
    <circle cx="293" cy="76" r="4.5"/>
    <circle cx="313" cy="76" r="4.5"/>
    <circle cx="333" cy="76" r="4.5"/>
  </g>

  <text x="73" y="106" text-anchor="middle" font-size="10.5" fill="var(--muted, #666)">bandit-like</text>
  <text x="180" y="106" text-anchor="middle" font-size="10.5" fill="var(--muted, #666)">intermediate</text>
  <text x="293" y="106" text-anchor="middle" font-size="10.5" fill="var(--muted, #666)">full information</text>

  <!-- cost axis -->
  <line x1="20" y1="140" x2="340" y2="140" stroke="var(--muted, #666)" stroke-width="1.5" marker-end="url(#exp-ar)"/>
  <text x="20" y="160" font-size="11" fill="var(--muted, #666)">expensive</text>
  <text x="340" y="160" text-anchor="end" font-size="11" fill="var(--muted, #666)">cheap</text>
  <text x="180" y="160" text-anchor="middle" font-size="11" fill="currentColor">cost of one expert's opinion</text>

  <text x="180" y="188" text-anchor="middle" font-size="10.5" fill="var(--muted, #666)">Matching upper and lower bounds hold in every regime.</text>
</svg>
